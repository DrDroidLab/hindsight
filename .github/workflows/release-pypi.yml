name: release-pypi
# A v* tag publishes hindsight-sre to PyPI and creates the GitHub release.
# A manual run publishes a .devN build of the current version to TestPyPI as a dry run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-pypi-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches project version
        if: github.ref_type == 'tag'
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
            exit 1
          fi
          if ! python -c 'import json, sys; s = json.load(open("server.json")); sys.exit(any(v != sys.argv[1] for v in [s["version"], *(p["version"] for p in s["packages"])]))' "${version}"; then
            echo "::error::server.json versions do not match pyproject.toml version ${version}"
            exit 1
          fi
      - name: Use a unique dev version for the TestPyPI dry run
        if: github.event_name == 'workflow_dispatch'
        run: sed -i -E "s/^version = \"([^\"]+)\"/version = \"\1.dev${GITHUB_RUN_NUMBER}\"/" pyproject.toml
      - run: pip install 'build>=1' 'twine>=6'
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Check wheel bundles the UI and sample knowledge
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          required = ["hindsight/static/index.html", "hindsight/static/assets/app.js"]
          missing = [n for n in required if n not in names]
          if not any(n.startswith("hindsight/sample-knowledge/") for n in names):
              missing.append("hindsight/sample-knowledge/")
          if missing:
              raise SystemExit(f"wheel is missing: {missing}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/hindsight-sre
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hindsight-sre
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    if: github.ref_type == 'tag'
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release with the built distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --title "$GITHUB_REF_NAME"
