name: Feature or integration request
description: Suggest an improvement, a redaction rule or support for another agent.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Hindsight do? For a new agent, link its MCP and hook documentation.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require Hindsight to run commands against production or act as an agent itself.
          required: true
