[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "hindsight-sre"
version = "0.1.0"
description = "Self-hosted, git-backed operational memory for coding agents: reviewed runbooks and incident learnings over MCP"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["mcp", "sre", "runbooks", "incident-response", "coding-agents", "claude-code", "cursor", "operational-memory", "postmortem"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "mcp==1.30.0",
  "PyYAML>=6,<7", "regex>=2024.11", "filelock>=3.16",
  "httpx>=0.28,<1", "pydantic>=2.10,<3",
]

[project.optional-dependencies]
docs = ["mkdocs-material>=9.5,<10"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9", "mypy>=1.13", "types-PyYAML", "build>=1"]

[project.urls]
Homepage = "https://drdroidlab.github.io/hindsight/"
Documentation = "https://drdroidlab.github.io/hindsight/"
Repository = "https://github.com/DrDroidLab/hindsight"
Issues = "https://github.com/DrDroidLab/hindsight/issues"

[project.scripts]
hindsight = "hindsight.cli:main"
# Alias matching the package name, so `uvx hindsight-sre mcp-proxy` works (MCP Registry entry).
hindsight-sre = "hindsight.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hindsight"]

[tool.hatch.build.targets.wheel.force-include]
"examples/sample-knowledge" = "hindsight/sample-knowledge"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
