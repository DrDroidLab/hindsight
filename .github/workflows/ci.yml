name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-and-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -c requirements.lock -e '.[dev]'
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm test --prefix web
      - run: npm audit --prefix web --omit=dev --audit-level=moderate
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy src/hindsight
      - run: pytest -q
      - run: python -m build
  image-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root production image
        run: docker build -t hindsight-sre:ci .
      - name: Run offline seeded demo smoke
        run: python3 scripts/demo-smoke.py --image hindsight-sre:ci
